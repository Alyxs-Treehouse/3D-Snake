name: Godot checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned tooling and engine
        run: |
          python -m pip install -r requirements-dev.txt
          python tools/bootstrap.py --linux-engine
      - name: Check style and module boundaries
        run: ./tools/dev.sh lint
      - name: Run unit, integration and scene checks
        env:
          SNAKE_GODOT_BIN: ${{ github.workspace }}/.cache/godot/Godot_v4.4.1-stable_linux.x86_64
        run: ./tools/dev.sh check
      - name: Record CPU benchmark
        env:
          SNAKE_GODOT_BIN: ${{ github.workspace }}/.cache/godot/Godot_v4.4.1-stable_linux.x86_64
        run: ./tools/dev.sh benchmark
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: validation-evidence
          path: |
            builds/validation.log
            builds/test-results.xml
            builds/performance.json
          retention-days: 14
